name: DevDNA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check backend/

  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Run backend pytest suite
        working-directory: backend
        run: |
          python -m pytest -v

  frontend-tests:
    name: Frontend Tests & Production Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Vitest component tests
        working-directory: frontend
        run: |
          npm test -- --run

      - name: Compile Vite production bundle
        working-directory: frontend
        run: |
          npm run build
