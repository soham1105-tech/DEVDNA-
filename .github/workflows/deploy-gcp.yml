name: Deploy DevDNA to Google Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write  # Required for GCP Workload Identity Federation (no long-lived JSON keys)

jobs:
  verify:
    name: Mandatory Test & Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install & test backend
        run: |
          pip install -r backend/requirements.lock
          cd backend && python -m pytest -q

      - name: Install & test AST engine
        run: |
          pip install -r ast-engine/requirements.txt pytest
          cd ast-engine && python -m pytest -q

      - uses: actions/setup-node@39370e3970a6d050c480ffad7ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Test & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          VITE_AST_ENGINE_URL=/ast npm run build

  deploy:
    name: Build, Push & Deploy (${{ inputs.environment }})
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AR_REPO: devdna
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build & push immutable container images
        run: |
          SHA="${GITHUB_SHA::12}"
          docker build -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/devdna-backend:${SHA}" ./backend
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/devdna-backend:${SHA}"
          docker build -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/devdna-ast-engine:${SHA}" ./ast-engine
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/devdna-ast-engine:${SHA}"

      - name: Deploy backend to Cloud Run
        run: |
          SHA="${GITHUB_SHA::12}"
          gcloud run deploy "devdna-${{ inputs.environment }}-backend" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/devdna-backend:${SHA}" \
            --region="${REGION}" \
            --platform=managed \
            --min-instances=0 \
            --max-instances=4 \
            --set-env-vars="DEVDNA_EXPERIMENTS_ENABLED=false,DEVDNA_LOG_FORMAT=json,DEVDNA_CORS_ORIGINS=${{ vars.DEVDNA_CORS_ORIGINS }},DEVDNA_GCS_BUCKET=${{ vars.DEVDNA_GCS_BUCKET }}"

      - name: Post-deployment health & readiness verification
        run: |
          URL="$(gcloud run services describe "devdna-${{ inputs.environment }}-backend" --region="${REGION}" --format='value(status.url)')"
          curl -fsS "${URL}/api/health"
          curl -fsS "${URL}/api/ready"
