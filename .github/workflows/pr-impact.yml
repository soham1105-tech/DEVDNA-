name: DevDNA PR Impact

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: devdna-pr-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    name: Static impact and route coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Fetch changed file list
        id: changed-files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/devdna-changed-files.txt`;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            fs.writeFileSync(path, files.map(file => file.filename).join('\n'));
            core.setOutput('path', path);

      - name: Check out pull request source for static analysis
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          persist-credentials: false

      - name: Generate Markdown and JSON impact reports
        id: report
        working-directory: backend
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.path }}
          REPORT_MD: ${{ runner.temp }}/devdna-impact.md
          REPORT_JSON: ${{ runner.temp }}/devdna-impact.json
        run: |
          set +e
          python -m app.cli "$GITHUB_WORKSPACE/pr-source" \
            --changed-files-file "$CHANGED_FILES" \
            --markdown-output "$REPORT_MD" \
            --json-output "$REPORT_JSON" \
            --fail-on-uncovered-route
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi

      - name: Create or update the PR impact comment
        uses: actions/github-script@v7
        env:
          REPORT_MD: ${{ runner.temp }}/devdna-impact.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devdna-pr-impact -->';
            const body = `${marker}\n${fs.readFileSync(process.env.REPORT_MD, 'utf8')}`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Fail check for uncovered impacted routes
        if: steps.report.outputs.exit_code == '1'
        run: |
          echo "DevDNA found impacted routes without a statically mapped predicted-failing test."
          exit 1
