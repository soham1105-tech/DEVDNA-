# Ruff lint configuration for the DevDNA backend.
# Deliberately minimal: pyflakes (F), the pycodestyle errors that catch real
# mistakes (E4/E7/E9). Formatting is out of scope; add rules deliberately.
target-version = "py311"
line-length = 120
extend-exclude = ["frontend", "ast-engine", "sample_project", "sandbox"]

[lint]
select = ["E4", "E7", "E9", "F"]
