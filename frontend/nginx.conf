server {
    listen 80;

    # Same-origin proxies: the browser never talks to the services directly,
    # so no CORS configuration is needed in the containers.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;   # AI explanations can take minutes
    }

    location /ast/ {
        proxy_pass http://ast-engine:8001/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
